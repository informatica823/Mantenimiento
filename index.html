<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mantenimiento - simil</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 45px 40px;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        .icon {
            font-size: 50px;
            margin-bottom: 16px;
            display: inline-block;
            animation: mover 2.5s ease-in-out infinite;
        }
        @keyframes mover {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-12deg); }
            75% { transform: rotate(12deg); }
        }
        h1 {
            font-size: 22px;
            color: #667eea;
            margin-bottom: 16px;
        }
        p {
            color: #555;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 8px;
        }
        .footer {
            margin-top: 24px;
            font-size: 12.5px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🔧</div>
        <h1>🏥 simil</h1>
        <p>Estamos haciendo actualizaciones importantes para mejorar la plataforma.</p>
        <p>Va a estar disponible de nuevo en breve.</p>
        <p>Gracias por la paciencia mientras laburamos en esto.</p>
        <div class="footer">Volvé a intentar en unos minutos</div>
    </div>
</body>
</html>
